name: ChaoxingSigner
options:
  bundleIdPrefix: fun.aquamarine5
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ChaoxingSigner:
    type: application
    platform: iOS
    sources:
      - path: ChaoxingSigner
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.aquamarine5.cxsign
        PRODUCT_NAME: ChaoxingSigner
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ChaoxingSigner/Resources/Info.plist
        SWIFT_STRICT_CONCURRENCY: minimal
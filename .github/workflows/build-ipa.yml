name: build-ipa

# 在 GitHub 的 macOS runner 上编译出未签名 ipa，
# 然后把 ipa 下载到 Windows，用 Sideloadly / AltStore 用自己的 Apple ID 签名装进 iPhone。
#
# 用法：把 ChaoxingSigner-iOS 目录里的内容推到一个 GitHub 仓库（作为仓库根目录），
# 打开 Actions → build-ipa → Run workflow，跑完在 Artifacts 里下载 ChaoxingSigner-unsigned。
#
# 编译日志：失败时会把错误写成仓库 ci-logs 分支上的 ci-error-<os>.txt，
# 这样不登录 GitHub 也能读到具体报错（raw.githubusercontent.com）。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    # macos-15 是 arm64 镜像，macos-13 是 Intel；两个都跑，谁先成功用谁。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -list -project ChaoxingSigner.xcodeproj

      - name: 编译（关闭签名）
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project ChaoxingSigner.xcodeproj \
            -scheme ChaoxingSigner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log
          exit $?

      - name: 把编译日志推到 ci-logs 分支
        if: always()
        continue-on-error: true
        run: |
          OUT="ci-error-${{ matrix.os }}.txt"
          {
            echo "os: ${{ matrix.os }}"
            echo "outcome: ${{ steps.build.outcome }}"
            echo ""
            echo "===== errors ====="
            grep -nE '(^| )error: ' build.log 2>/dev/null | head -120
            echo ""
            echo "===== warnings (selected) ====="
            grep -nE 'warning: ' build.log 2>/dev/null | head -40
            echo ""
            echo "===== tail ====="
            tail -120 build.log 2>/dev/null
          } > "$OUT"
          cp "$OUT" /tmp/"$OUT"
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git checkout -B ci-logs
          cp /tmp/"$OUT" "$OUT"
          git add -f "$OUT"
          git commit -m "ci: ${{ matrix.os }} $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push -f origin ci-logs

      - name: 打包未签名 ipa
        if: steps.build.outcome == 'success'
        run: |
          APP="build/Build/Products/Release-iphoneos/ChaoxingSigner.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ChaoxingSigner-unsigned.ipa Payload
          ls -lh ChaoxingSigner-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ChaoxingSigner-unsigned-${{ matrix.os }}
          path: ChaoxingSigner-unsigned.ipa
          if-no-files-found: error
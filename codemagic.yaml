workflows:
  ios-unsigned:
    name: ChaoxingSigner 未签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: ChaoxingSigner
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 显示环境
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -list -project ChaoxingSigner.xcodeproj
      - name: 编译（关闭签名）
        script: |
          set -o pipefail
          xcodebuild \
            -project ChaoxingSigner.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log
      - name: 打包未签名 ipa
        script: |
          APP="build/Build/Products/Release-iphoneos/ChaoxingSigner.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ChaoxingSigner-unsigned.ipa Payload
          ls -lh ChaoxingSigner-unsigned.ipa
    artifacts:
      - ChaoxingSigner-unsigned.ipa
      - build.log